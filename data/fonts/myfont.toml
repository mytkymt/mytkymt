# Font style metadata
name = "myfont"

# Noto Sans for Latin, Noto Sans JP for Japanese.
#
# Weights loaded (see custom.scss for where each is applied):
#   Noto Sans     200  ExtraLight — English body text
#   Noto Sans     300  Light      — Japanese pages' Latin runs
#   Noto Sans     400  Regular
#   Noto Sans     700  Bold       — headings and <strong>
#   Noto Sans JP  300  Light      — Japanese body text
#   Noto Sans JP  400  Regular
#   Noto Sans JP  700  Bold
#
# All at normal width. Noto Sans does expose a `wdth` axis (Condensed is
# available as wdth=75), but the condensed cut read as too light here.
google_fonts = "family=Noto+Sans:wght@200;300;400;700&family=Noto+Sans+JP:wght@300;400;700"

# Font families
heading_font = "Noto Sans"
body_font = "Noto Sans"
nav_font = "Noto Sans"
mono_font = "SFMono-Regular"
